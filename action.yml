name: 'PR Deployment Status Dashboard'
description: 'Automatically adds a comment to Pull Requests showing deployment status across all environments'
author: 'Your Name'

inputs:
  github-token:
    description: 'GitHub token used to create/update comments'
    required: true
    default: ${{ github.token }}
  timezone:
    description: 'Timezone for date formatting (IANA time zone format)'
    required: false
    default: 'America/Regina'

runs:
  using: 'composite'
  steps:
    - name: Build deployment status
      uses: actions/github-script@v6
      id: report
      with:
        script: |
          const { owner, repo } = context.repo;
          const pr = context.payload.pull_request?.number;
          if (!pr) throw new Error('No PR number in context');
          const TZ = '${{ inputs.timezone }}';
          const commentHeader = '🚀 Deployment Status Dashboard';
          const currentPrBranch = context.payload.pull_request?.head?.ref;
          const currentPrSha = context.payload.pull_request?.head?.sha;

          function fmtDate(s) {
            if (!s) return 'Unknown';
            const d = new Date(s);
            if (isNaN(d)) return 'Unknown';
            return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric',timeZone:TZ})
              + ' at ' +
              d.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',timeZone:TZ});
          }

          function mkLink(u, t) {
            return u ? `[${t}](${u})` : '-';
          }

          const all = await github.rest.repos.listDeployments({ owner, repo, per_page:100 });
          const envs = [...new Set(all.data.map(x=>x.environment).filter(Boolean))];
          const order = { 
            prod: 0, 
            production: 0, 
            live: 0, 
            staging: 1, 
            beta: 1, 
            uat: 1, 
            testing: 1, 
            test: 1, 
            dev: 2, 
            development: 2, 
            local: 2, 
            preview: 3 
          };
          envs.sort((a,b)=>{
            const ak = Object.keys(order).find(k=>a.toLowerCase().includes(k))||'';
            const bk = Object.keys(order).find(k=>b.toLowerCase().includes(k))||'';
            return (order[ak]||999)-(order[bk]||999);
          });

          let body = `<h2>${commentHeader}</h2><table><thead><tr>`
                   + '<th>Environment</th><th>Status</th><th>Branch/Commit</th>'
                   + '<th>Deployed By</th><th>Last Deployment</th><th>URL</th>'
                   + '<th>Availability</th>'
                   + '</tr></thead><tbody>';

          for (const e of envs) {
            const { data: [dep] } = await github.rest.repos.listDeployments({ owner, repo, environment:e, per_page:1 });
            let availabilityStatus = '✅ Available for deployment';
            let availabilityEmoji = '✅';
            let availabilityMessage = 'Available for deployment';
            
            if (!dep) {
              body += `<tr><td><strong>🔹 ${e}</strong></td><td>⚪️ No deployments</td>`
                    + `<td>-</td><td>-</td><td>-</td><td>-</td>`
                    + `<td>${availabilityEmoji} ${availabilityMessage}</td></tr>`;
              continue;
            }
            
            const [{ data: det }, { data: [st] }] = await Promise.all([
              github.rest.repos.getDeployment({ owner, repo, deployment_id:dep.id }),
              github.rest.repos.listDeploymentStatuses({ owner, repo, deployment_id:dep.id, per_page:1 })
            ]);

            const envEmoji = e.toLowerCase().includes('prod') || e.toLowerCase().includes('live')  ? '🌐'
                           : e.toLowerCase().includes('staging') || e.toLowerCase().includes('beta') || e.toLowerCase().includes('uat') || e.toLowerCase().includes('test') ? '🚧'
                           : e.toLowerCase().includes('dev') || e.toLowerCase().includes('local')   ? '🧪'
                           : e.toLowerCase().includes('preview')? '🔍'
                                                                : '🔹';
            const statusEmoji = st.state==='success'? '🟢'
                              : ['failure','error'].includes(st.state)? '🔴'
                              : ['pending','in_progress'].includes(st.state)? '🟡'
                              : st.state==='inactive'? '⚫️'
                              : '⚪️';

            const ref = dep.ref.replace('refs/heads/','');
            const sha = dep.sha.slice(0,7);
            const by  = st.creator?.login || det.creator?.login || 'Unknown';
            
            // Determine if the environment is occupied by this PR or another
            if (ref === currentPrBranch || dep.sha === currentPrSha) {
              availabilityEmoji = '✓';
              availabilityMessage = 'Currently deployed from this PR';
            } else if (['success', 'pending', 'in_progress'].includes(st.state)) {
              availabilityEmoji = '⚠️';
              availabilityMessage = `Occupied by ${ref}`;
            } else if (['failure', 'error'].includes(st.state)) {
              availabilityEmoji = '🔄';
              availabilityMessage = 'Deployment failed, can be redeployed';
            } else if (st.state === 'inactive') {
              availabilityEmoji = '✅';
              availabilityMessage = 'Available for deployment';
            }
            
            body += `<tr><td><strong>${envEmoji} ${e}</strong></td>`
                  + `<td>${statusEmoji} ${st.state||'unknown'}</td>`
                  + `<td>${ref} ([${sha}](https://github.com/${owner}/${repo}/commit/${dep.sha}))</td>`
                  + `<td>@${by}</td>`
                  + `<td>${fmtDate(st.created_at)}</td>`
                  + `<td>${(st.environment_url||st.target_url) ? mkLink(st.environment_url||st.target_url,'View deployment') : '-'}</td>`
                  + `<td>${availabilityEmoji} ${availabilityMessage}</td>`
                  + `</tr>`;
          }

          body += `</tbody></table>`
                + `<p><em>🔄 Last updated: ${fmtDate(new Date().toISOString())}</em></p>`;

          return body;

    - name: Find existing status comment
      uses: peter-evans/find-comment@v3
      id: find
      with:
        token: ${{ inputs.github-token }}
        repository: ${{ github.repository }}
        issue-number: ${{ github.event.pull_request.number }}
        comment-author: 'github-actions[bot]'
        body-includes: '🚀 Deployment Status Dashboard'

    - name: Create or update PR comment
      uses: peter-evans/create-or-update-comment@v4
      with:
        token: ${{ inputs.github-token }}
        repository: ${{ github.repository }}
        issue-number: ${{ github.event.pull_request.number }}
        comment-id: ${{ steps.find.outputs.comment-id }}
        body: ${{ steps.report.outputs.result }}
        edit-mode: replace
